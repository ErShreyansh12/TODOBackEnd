services:
  backend:
    build: .
    ports:
      - "8089:5000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/todo_task_db
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
